openapi: 3.0.3
info:
  title: SMEHUB - Stellar Merchant Payment Platform API
  version: 1.0.0
  description: 'Production-grade RESTful API for SMEHUB: Enabling small and medium
    businesses to accept, settle, and track digital payments via Stellar Testnet (USDC
    / XLM) and Soroban Smart Contracts.'
paths:
  /api/analytics/charts/volume/:
    get:
      operationId: api_analytics_charts_volume_retrieve
      description: Returns daily aggregated payment volume and count for the past
        7, 14, or 30 days.
      summary: Get daily payment volume time-series chart data
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Number of days to look back (default 14, max 90)
      tags:
      - Analytics
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyVolumeChartResponse'
          description: ''
  /api/analytics/dashboard/:
    get:
      operationId: api_analytics_dashboard_retrieve
      description: 'Returns complete merchant dashboard summary: total USDC and XLM
        volume, counts of completed/pending/expired payments, conversion rate, wallet
        status, and recent activity.'
      summary: Get merchant dashboard metrics
      tags:
      - Analytics
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetricsResponse'
          description: ''
  /api/contracts/info/:
    get:
      operationId: api_contracts_info_retrieve
      description: Returns Stellar Soroban payment router contract ID, methods, and
        EVM contract details.
      summary: Get Smart Contract metadata and interface
      tags:
      - Contracts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractInfoResponse'
          description: ''
  /api/contracts/soroban/build-pay/:
    post:
      operationId: api_contracts_soroban_build_pay_create
      description: Constructs the Soroban smart contract call parameters for client-side
        wallet signing.
      summary: Build Soroban payment invocation arguments
      tags:
      - Contracts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SorobanPayInvocationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SorobanPayInvocationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SorobanPayInvocationRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractInvocationResponse'
          description: ''
  /api/docs/openai-tools/:
    get:
      operationId: api_docs_openai_tools_retrieve
      description: Returns OpenAI-compatible function calling tool schemas for AI
        assistant integration with SMEHUB.
      summary: OpenAI Function Calling / Tool Definitions
      tags:
      - System
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIToolsResponse'
          description: ''
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: Returns operational status of the SMEHUB Stellar backend API.
      summary: API health and readiness check
      tags:
      - System
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /api/merchants/api-key/refresh/:
    post:
      operationId: merchant_refresh_api_key
      description: Revokes existing API key and issues a newly generated secure API
        key for the merchant.
      summary: Regenerate merchant API key
      tags:
      - Merchants
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyRefreshResponse'
          description: ''
  /api/merchants/login/:
    post:
      operationId: api_merchants_login_create
      description: Log in with merchant username or email and password to receive
        an authentication token.
      summary: Authenticate merchant and obtain auth token
      tags:
      - Merchants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MerchantLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantLoginResponse'
          description: ''
        '401':
          description: Invalid credentials
  /api/merchants/login/wallet/:
    post:
      operationId: api_merchants_login_wallet_create
      description: Log in using connected Stellar Testnet public key. Optionally auto-creates
        account if auto_register is True.
      summary: Authenticate merchant via Stellar wallet
      tags:
      - Merchants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantWalletAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantWalletAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MerchantWalletAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantWalletLoginResponse'
          description: ''
        '404':
          description: Wallet not registered as a merchant
  /api/merchants/profile/:
    get:
      operationId: api_merchants_profile_retrieve
      description: Retrieve or update the authenticated merchant business details,
        contact info, and payment settings.
      summary: Get or update merchant profile
      tags:
      - Merchants
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProfileResponse'
          description: ''
    put:
      operationId: api_merchants_profile_update
      description: Retrieve or update the authenticated merchant business details,
        contact info, and payment settings.
      summary: Get or update merchant profile
      tags:
      - Merchants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MerchantProfileRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProfileResponse'
          description: ''
    patch:
      operationId: api_merchants_profile_partial_update
      description: Retrieve or update the authenticated merchant business details,
        contact info, and payment settings.
      summary: Get or update merchant profile
      tags:
      - Merchants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMerchantProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMerchantProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMerchantProfileRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProfileResponse'
          description: ''
  /api/merchants/register/:
    post:
      operationId: api_merchants_register_create
      description: Creates a new SME merchant account, business profile, API key,
        and optionally connects a Stellar Testnet wallet.
      summary: Register a new merchant business profile
      tags:
      - Merchants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MerchantRegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantRegisterResponse'
          description: ''
        '400':
          description: Validation error
  /api/merchants/register/wallet/:
    post:
      operationId: api_merchants_register_wallet_create
      description: Instant merchant onboarding using Stellar Testnet wallet. Skips
        profile form filling, allowing merchants to configure business details later
        in Settings.
      summary: Register or quick-onboard via Stellar wallet
      tags:
      - Merchants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantWalletAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantWalletAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MerchantWalletAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantWalletAuthResponse'
          description: ''
        '400':
          description: Invalid public key format
  /api/merchants/wallet/:
    get:
      operationId: api_merchants_wallet_retrieve
      description: Fetches live Testnet XLM and USDC balances directly from the Stellar
        Horizon network for the merchant wallet.
      summary: View merchant wallet info and live Stellar balances
      tags:
      - Merchants
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletLiveInfoResponse'
          description: ''
  /api/merchants/wallet/connect/:
    post:
      operationId: api_merchants_wallet_connect_create
      description: Connect a non-custodial Stellar wallet (Freighter, Albedo, Lobstr)
        to receive customer payments.
      summary: Connect or update Stellar Testnet wallet
      tags:
      - Merchants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantWalletConnectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantWalletConnectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MerchantWalletConnectRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletConnectResponse'
          description: ''
        '400':
          description: Invalid public key or wallet already associated
  /api/payments/checkout/{reference_id}/:
    get:
      operationId: api_payments_checkout_retrieve
      description: Public endpoint for customers to review merchant details, amount,
        USDC Testnet asset, memo, and receive SEP-0007 / QR code payload.
      summary: Public customer checkout view
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        required: true
      tags:
      - Checkout
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCheckoutResponse'
          description: ''
        '404':
          description: Invoice not found
  /api/payments/requests/:
    get:
      operationId: merchant_list_payment_requests
      description: Returns a list of all payment requests generated by the authenticated
        merchant, with optional status filter.
      summary: List merchant payment requests
      parameters:
      - in: query
        name: currency
        schema:
          type: string
        description: 'Filter by currency: USDC, XLM'
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter by status: PENDING, COMPLETED, EXPIRED, CANCELLED'
      tags:
      - Payments
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
          description: ''
  /api/payments/requests/{reference_id}/:
    get:
      operationId: merchant_get_or_update_payment_request_detail
      description: Retrieve or update detailed information of a specific payment request
        by reference ID.
      summary: Get or edit payment request details
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        required: true
      tags:
      - Payments
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetailResponse'
          description: ''
        '400':
          description: Validation error
        '404':
          description: Payment request not found
    put:
      operationId: merchant_get_or_update_payment_request_detail_3
      description: Retrieve or update detailed information of a specific payment request
        by reference ID.
      summary: Get or edit payment request details
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        required: true
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequestUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequestUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetailResponse'
          description: ''
        '400':
          description: Validation error
        '404':
          description: Payment request not found
    patch:
      operationId: merchant_get_or_update_payment_request_detail_2
      description: Retrieve or update detailed information of a specific payment request
        by reference ID.
      summary: Get or edit payment request details
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        required: true
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPaymentRequestUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPaymentRequestUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPaymentRequestUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetailResponse'
          description: ''
        '400':
          description: Validation error
        '404':
          description: Payment request not found
  /api/payments/requests/{reference_id}/cancel/:
    post:
      operationId: merchant_cancel_payment_request
      description: Cancel an unpaid payment request before it expires or is settled.
      summary: Cancel a pending payment request
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        required: true
      tags:
      - Payments
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCancelResponse'
          description: ''
  /api/payments/requests/create/:
    post:
      operationId: api_payments_requests_create_create
      description: Generates a new payment request with amount, USDC Testnet/XLM,
        unique memo, SEP-0007 URI, and QR code for customer checkout.
      summary: Generate a new payment request / invoice
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequestCreateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreateResponse'
          description: ''
        '400':
          description: Validation error or wallet not connected
  /api/transactions/:
    get:
      operationId: merchant_list_transactions
      description: Returns transaction history for the authenticated merchant with
        explorer links, ledger numbers, and settlement timestamps.
      summary: List merchant transaction history
      parameters:
      - in: query
        name: asset_code
        schema:
          type: string
        description: 'Filter by asset code: USDC, XLM'
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter by status: SUCCESS, FAILED'
      tags:
      - Transactions
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
          description: ''
  /api/transactions/{tx_hash}/:
    get:
      operationId: merchant_get_transaction_detail
      description: Retrieve full on-chain transaction details, Stellar Expert explorer
        link, and ledger metadata.
      summary: Get transaction details by hash
      parameters:
      - in: path
        name: tx_hash
        schema:
          type: string
        required: true
      tags:
      - Transactions
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
          description: ''
        '404':
          description: Transaction not found
  /api/transactions/broadcast/{reference_id}/:
    post:
      operationId: api_transactions_broadcast_create
      description: Submits a signed transaction XDR to Stellar Horizon, executing
        payment and recording settlement.
      summary: Broadcast signed Stellar transaction XDR
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        required: true
      tags:
      - Checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionBroadcastRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionBroadcastRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionBroadcastRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBroadcastResponse'
          description: ''
  /api/transactions/prepare/{reference_id}/:
    post:
      operationId: api_transactions_prepare_create
      description: Constructs an unsigned Stellar transaction XDR for client-side
        wallet signing.
      summary: Prepare unsigned Stellar transaction XDR
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        required: true
      tags:
      - Checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPrepareRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionPrepareRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionPrepareRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPrepareResponse'
          description: ''
  /api/transactions/status/{reference_id}/:
    get:
      operationId: api_transactions_status_retrieve
      description: Poll endpoint used by checkout screen and merchant dashboard to
        check whether a payment request has been confirmed on the Stellar ledger.
      summary: Poll real-time payment status
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        required: true
      tags:
      - Checkout
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
          description: ''
  /api/transactions/verify/{reference_id}/:
    post:
      operationId: api_transactions_verify_create
      description: Submits a 64-character Stellar transaction hash for a payment request.
        Verifies on-chain execution via Stellar Horizon, matches destination, amount,
        and memo, and confirms payment.
      summary: Submit and verify Stellar Testnet transaction
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        required: true
      tags:
      - Transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionSubmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionSubmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionSubmitRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionVerifyResponse'
          description: ''
        '400':
          description: Verification failed or invalid hash
  /health/:
    get:
      operationId: health_retrieve
      description: Returns operational status of the SMEHUB Stellar backend API.
      summary: API health and readiness check
      tags:
      - System
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
components:
  schemas:
    ApiKeyRefreshResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
        api_key:
          type: string
      required:
      - api_key
      - message
    BlockchainTransactionStatusEnum:
      enum:
      - SUCCESS
      - FAILED
      - PENDING_CONFIRMATION
      type: string
      description: |-
        * `SUCCESS` - Confirmed on Ledger
        * `FAILED` - Failed on Ledger
        * `PENDING_CONFIRMATION` - Awaiting Ledger Ingestion
    ContractInfoResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        data:
          $ref: '#/components/schemas/SorobanContractInfo'
      required:
      - data
    ContractInvocationResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        data:
          $ref: '#/components/schemas/SorobanPayInvocationResponse'
      required:
      - data
    CurrencyEnum:
      enum:
      - USDC
      - XLM
      type: string
      description: |-
        * `USDC` - USD Coin (Stellar Testnet)
        * `XLM` - Stellar Lumens (Native)
    CustomerCheckoutResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        data:
          $ref: '#/components/schemas/PublicCheckout'
      required:
      - data
    DailyVolume:
      type: object
      properties:
        date:
          type: string
        usdc_volume:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        xlm_volume:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        count:
          type: integer
      required:
      - count
      - date
      - usdc_volume
      - xlm_volume
    DailyVolumeChartResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        days:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/DailyVolume'
      required:
      - data
      - days
    DashboardMetrics:
      type: object
      properties:
        business_name:
          type: string
        wallet_connected:
          type: boolean
        wallet_public_key:
          type: string
          nullable: true
        wallet_verified:
          type: boolean
        total_volume_usdc:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        total_volume_xlm:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        completed_payments_count:
          type: integer
        pending_payments_count:
          type: integer
        expired_payments_count:
          type: integer
        cancelled_payments_count:
          type: integer
        total_requests_count:
          type: integer
        conversion_rate:
          type: number
          format: double
        recent_activity:
          type: array
          items:
