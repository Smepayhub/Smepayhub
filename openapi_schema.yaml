      - contract_id
      - memo
      - method
      - network_passphrase
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference_id:
          type: string
          readOnly: true
        merchant_business_name:
          type: string
          readOnly: true
        tx_hash:
          type: string
          readOnly: true
          description: 64-character Stellar transaction hash
        source_account:
          type: string
          readOnly: true
          description: Payer's Stellar account
        destination_account:
          type: string
          readOnly: true
          description: Merchant's receiving account
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          readOnly: true
        asset_code:
          type: string
          readOnly: true
        asset_issuer:
          type: string
          readOnly: true
          nullable: true
        memo:
          type: string
          readOnly: true
        ledger:
          type: integer
          readOnly: true
          nullable: true
          description: Stellar ledger sequence number
        fee_charged:
          type: integer
          readOnly: true
          nullable: true
          description: Fee paid in stroops
        status:
          allOf:
          - $ref: '#/components/schemas/BlockchainTransactionStatusEnum'
          readOnly: true
        stellar_expert_url:
          type: string
          format: uri
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - asset_code
      - asset_issuer
      - created_at
      - destination_account
      - fee_charged
      - id
      - ledger
      - memo
      - merchant_business_name
      - reference_id
      - source_account
      - status
      - stellar_expert_url
      - tx_hash
      - verified_at
    TransactionBroadcastRequest:
      type: object
      properties:
        signed_xdr:
          type: string
          minLength: 10
          description: Base64-encoded signed Stellar transaction envelope XDR
      required:
      - signed_xdr
    TransactionBroadcastResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
        tx_hash:
          type: string
        ledger:
          type: integer
        data:
          $ref: '#/components/schemas/Transaction'
      required:
      - data
      - ledger
      - message
      - tx_hash
    TransactionDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        data:
          $ref: '#/components/schemas/Transaction'
      required:
      - data
    TransactionListResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
      required:
      - count
      - results
    TransactionPrepareRequest:
      type: object
      properties:
        payer_address:
          type: string
          minLength: 56
          description: Stellar public key of payer account (starts with G, 56 chars)
          maxLength: 56
        currency:
          type: string
          default: ''
      required:
      - payer_address
    TransactionPrepareResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        xdr:
          type: string
        network_passphrase:
          type: string
        payer_address:
          type: string
        destination_address:
          type: string
        amount:
          type: string
        currency:
          type: string
        used_currency:
          type: string
        memo:
          type: string
      required:
      - amount
      - currency
      - destination_address
      - memo
      - network_passphrase
      - payer_address
      - used_currency
      - xdr
    TransactionSubmitRequest:
      type: object
      properties:
        tx_hash:
          type: string
          minLength: 64
          description: 64-character hexadecimal Stellar Testnet transaction hash
          maxLength: 64
      required:
      - tx_hash
    TransactionVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Transaction'
      required:
      - data
      - message
    WalletConnectResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
        wallet:
          $ref: '#/components/schemas/MerchantWallet'
      required:
      - message
      - wallet
    WalletLiveInfoResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        data:
          $ref: '#/components/schemas/MerchantWalletLiveInfo'
      required:
      - data
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
tags:
- name: Merchants
  description: Merchant registration, business profiles, and Stellar wallet integration
- name: Payments
  description: Payment request / invoice generation, QR code rendering, SEP-0007 URIs
- name: Checkout
  description: Public customer checkout, invoice review, and payment authorization
- name: Transactions
  description: Stellar Testnet transaction tracking, blockchain verification, and
    audit logs
- name: Analytics
  description: Merchant dashboard metrics, volume summaries, and payment statuses
- name: Contracts
  description: Soroban & EVM Smart Contract routing and parameters
