services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "${FRONTEND_PORT:-0}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - BACKEND_URL=http://web:8000
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
    networks:
      - smehub_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["gunicorn"]
    expose:
      - "8000"
    ports:
      - "${PORT:-0}:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-smehub-live-vps-deploy-secure-key-2026-getsmehub-stellar}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-getsmehub.com,www.getsmehub.com,173.214.172.222,localhost,127.0.0.1,web,*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://getsmehub.com,http://getsmehub.com,https://www.getsmehub.com,http://www.getsmehub.com,https://173.214.172.222,http://173.214.172.222}
      - DB_ENGINE=${DB_ENGINE:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-smehub_db}
      - POSTGRES_USER=${POSTGRES_USER:-smehub_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-smehub_secure_password_2026}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STELLAR_NETWORK=${STELLAR_NETWORK:-TESTNET}
      - STELLAR_HORIZON_URL=${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      - STELLAR_PASSPHRASE=${STELLAR_PASSPHRASE:-Test SDF Network ; September 2015}
      - USDC_ASSET_CODE=${USDC_ASSET_CODE:-USDC}
      - USDC_ISSUER_ADDRESS=${USDC_ISSUER_ADDRESS:-GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5}
      - STELLAR_EXPERT_BASE_URL=${STELLAR_EXPERT_BASE_URL:-https://stellar.expert/explorer/testnet/tx/}
      - SMEHUB_BASE_CHECKOUT_URL=${SMEHUB_BASE_CHECKOUT_URL:-https://getsmehub.com/checkout/}
      - SOROBAN_CONTRACT_ID=${SOROBAN_CONTRACT_ID:-CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC}
      - AUTO_POPULATE_DEMO_DATA=${AUTO_POPULATE_DEMO_DATA:-false}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - app_data:/app/data
    networks:
      - smehub_network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    ports:
      - "${POSTGRES_HOST_PORT:-0}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-smehub_db}
      - POSTGRES_USER=${POSTGRES_USER:-smehub_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-smehub_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smehub_user} -d ${POSTGRES_DB:-smehub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smehub_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    ports:
      - "${REDIS_HOST_PORT:-0}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smehub_network

volumes:
  postgres_data:
    name: smehub_postgres_data
    driver: local
  redis_data:
    name: smehub_redis_data
    driver: local
  static_volume:
    name: smehub_static_volume
    driver: local
  media_volume:
    name: smehub_media_volume
    driver: local
  app_data:
    name: smehub_app_data
    driver: local

networks:
  smehub_network:
    name: smehub_network
    driver: bridge
